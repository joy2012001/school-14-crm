<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug - 14-мактаб CRM</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container mt-5">
        <h1>🔧 Debug Panel</h1>
        
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Проверка загрузки файлов</h5>
                    </div>
                    <div class="card-body">
                        <div id="fileCheck">
                            <p>Проверка файлов...</p>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Проверка Firebase</h5>
                    </div>
                    <div class="card-body">
                        <div id="firebaseCheck">
                            <p>Проверка Firebase...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row mt-3">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header">
                        <h5>Тестирование функций</h5>
                    </div>
                    <div class="card-body">
                        <button class="btn btn-primary me-2" onclick="testLogin()">Тест входа</button>
                        <button class="btn btn-success me-2" onclick="testLanguage()">Тест языка</button>
                        <button class="btn btn-info me-2" onclick="testStyles()">Тест стилей</button>
                        <button class="btn btn-warning" onclick="testFirebase()">Тест Firebase</button>
                        
                        <div id="testResults" class="mt-3">
                            <h6>Результаты тестов:</h6>
                            <div id="results"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row mt-3">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header">
                        <h5>Консоль ошибок</h5>
                    </div>
                    <div class="card-body">
                        <div id="errorLog">
                            <p>Ошибки будут отображаться здесь...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDvF0qDIv6W93D8yRpNusVO-7kUJM0cD6I",
            authDomain: "school-14-crm.firebaseapp.com",
            projectId: "school-14-crm",
            storageBucket: "school-14-crm.firebasestorage.app",
            messagingSenderId: "11516954370",
            appId: "1:11516954370:web:b85ce688ce69edeab4a41b",
            measurementId: "G-5P16WDYGFW"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Error logging
        window.onerror = function(msg, url, line, col, error) {
            const errorLog = document.getElementById('errorLog');
            errorLog.innerHTML += `<div class="alert alert-danger">
                <strong>Error:</strong> ${msg}<br>
                <strong>Line:</strong> ${line}<br>
                <strong>URL:</strong> ${url}
            </div>`;
            return false;
        };

        // Check files
        function checkFiles() {
            const files = [
                'index.html',
                'style.css',
                'style.scss',
                'app.js',
                'Logo.jpg',
                'favicon.png'
            ];
            
            let html = '<ul class="list-group">';
            files.forEach(file => {
                fetch(file, { method: 'HEAD' })
                    .then(response => {
                        const status = response.ok ? 
                            '<span class="badge bg-success">OK</span>' : 
                            '<span class="badge bg-danger">ERROR</span>';
                        return `<li class="list-group-item d-flex justify-content-between">
                            ${file} ${status}
                        </li>`;
                    })
                    .catch(() => {
                        return `<li class="list-group-item d-flex justify-content-between">
                            ${file} <span class="badge bg-danger">NOT FOUND</span>
                        </li>`;
                    });
            });
            html += '</ul>';
            document.getElementById('fileCheck').innerHTML = html;
        }

        // Check Firebase
        function checkFirebase() {
            try {
                if (firebase.apps.length > 0) {
                    document.getElementById('firebaseCheck').innerHTML = 
                        '<div class="alert alert-success">✅ Firebase подключен успешно</div>';
                } else {
                    document.getElementById('firebaseCheck').innerHTML = 
                        '<div class="alert alert-danger">❌ Firebase не подключен</div>';
                }
            } catch (error) {
                document.getElementById('firebaseCheck').innerHTML = 
                    `<div class="alert alert-danger">❌ Ошибка Firebase: ${error.message}</div>`;
            }
        }

        // Test functions
        function testLogin() {
            addResult('Тест входа', 'Проверка mock входа...');
            
            // Mock login test
            const mockUsers = [
                { email: 'admin@school14.uz', password: 'admin123', role: 'admin' },
                { email: 'teacher@school14.uz', password: 'teacher123', role: 'teacher' },
                { email: 'director@school14.uz', password: 'director123', role: 'director' }
            ];
            
            const user = mockUsers[0];
            if (user) {
                addResult('Тест входа', '✅ Mock вход работает', 'success');
            } else {
                addResult('Тест входа', '❌ Mock вход не работает', 'danger');
            }
        }

        function testLanguage() {
            addResult('Тест языка', 'Проверка переключения языка...');
            
            const translations = {
                ru: { title: '14-мактаб CRM' },
                uz: { title: '14-maktab CRM' }
            };
            
            if (translations.ru && translations.uz) {
                addResult('Тест языка', '✅ Переводы загружены', 'success');
            } else {
                addResult('Тест языка', '❌ Переводы не найдены', 'danger');
            }
        }

        function testStyles() {
            addResult('Тест стилей', 'Проверка CSS...');
            
            const testElement = document.createElement('div');
            testElement.className = 'btn btn-primary';
            document.body.appendChild(testElement);
            
            const styles = window.getComputedStyle(testElement);
            const hasBootstrap = styles.backgroundColor && styles.padding;
            
            document.body.removeChild(testElement);
            
            if (hasBootstrap) {
                addResult('Тест стилей', '✅ Bootstrap стили загружены', 'success');
            } else {
                addResult('Тест стилей', '❌ Bootstrap стили не загружены', 'danger');
            }
        }

        function testFirebase() {
            addResult('Тест Firebase', 'Проверка подключения...');
            
            try {
                const testDoc = db.collection('test').doc('test');
                addResult('Тест Firebase', '✅ Firestore доступен', 'success');
            } catch (error) {
                addResult('Тест Firebase', `❌ Ошибка Firestore: ${error.message}`, 'danger');
            }
        }

        function addResult(testName, message, type = 'info') {
            const results = document.getElementById('results');
            const alertClass = type === 'success' ? 'alert-success' : 
                            type === 'danger' ? 'alert-danger' : 'alert-info';
            
            results.innerHTML += `<div class="alert ${alertClass}">
                <strong>${testName}:</strong> ${message}
            </div>`;
        }

        // Initialize checks
        document.addEventListener('DOMContentLoaded', function() {
            checkFiles();
            checkFirebase();
        });
    </script>
</body>
</html>
